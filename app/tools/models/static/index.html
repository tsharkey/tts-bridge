<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Models · TTS Bridge</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; }
  main { flex: 1; min-height: 0; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  #choosing { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--panel); border-radius: 0 6px 6px 0; }
  #browser { flex: 1; min-height: 0; }
  #favFor { margin: 0; padding: 10px 14px; }
  #favFor label { margin: 0; }
  #favFor select { flex: 0 1 240px; }
  a { color: var(--accent); }
  @media (max-width: 800px) { body { height: auto; } }
</style>
</head>
<body>
<header>
  <h1><a href="/">TTS Bridge</a> › Models</h1>
  <div class="status"><span class="dot" id="ttsDot"></span><span id="ttsText">Checking TTS…</span></div>
  <div class="spacer"></div>
</header>
<main>
  <div id="choosing" hidden></div>
  <section id="favFor">
    <div class="row">
      <label class="fit" for="favArmy">Favorites for</label>
      <select id="favArmy"><option value="">Pick an army…</option></select>
      <input id="favUnit" list="favUnits" placeholder="…and a unit (type its name)">
      <datalist id="favUnits"></datalist>
      <button class="fit" id="favClear">Clear</button>
    </div>
    <p class="hint" id="favHint">Pick an army and a unit, then star the models you like for it. Scribe tries a unit's
      favourites first when it picks models, and lists them first when you choose.</p>
  </section>
  <div id="browser"></div>
</main>

<script type="importmap">
{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
             "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script src="/shared.js"></script>
<script type="module">
import {modelBrowser} from "/model-browser.js";

// ?faction=&sub= starts on that army; with &key=<model pin key>&model=<name>&back=<page>,
// "Use this" pins the choice for that list model and goes back.
const p = new URLSearchParams(location.search);
const key = p.get("key"), back = p.get("back");
const safeBack = back && back.startsWith("/") && !back.startsWith("//") ? back : null;
if (key) {
  $("#choosing").hidden = false;
  $("#choosing").innerHTML = `Choosing the TTS model for <b></b>.` + (safeBack ? ` <a>Back without choosing</a>` : "");
  $("#choosing b").textContent = p.get("model") || "a model";
  if (safeBack) $("#choosing a").href = safeBack;
}
const onPick = key ? async m => {
  await api("/api/pin", {key, pick: m.pick});
  if (safeBack) location.href = safeBack;
  else $("#choosing").textContent = `Pinned ${m.name} for ${p.get("model") || "that model"}.`;
} : null;
const browser = modelBrowser($("#browser"), {
  faction: p.get("faction") || "", sub: p.get("sub") || "", query: p.get("q") || "",
  favoriteKey: p.get("fav") || "", onPick,
});

// "Favorites for": the army's own (chapter) name is the key's first part, as Scribe keys it
async function loadArmies() {
  const armies = await api("/api/models/armies").catch(() => []);
  $("#favArmy").innerHTML += armies.map(a => `<option>${a.replace(/[<&]/g, "")}</option>`).join("");
  const fav = p.get("fav");
  if (fav) {
    const [army, unit] = fav.split("|");
    $("#favArmy").value = army;
    $("#favUnit").value = unit || "";
    await loadUnits();
    applyFavFor();
  } else if (p.get("sub") || p.get("faction")) {
    $("#favArmy").value = p.get("sub") || p.get("faction");
    await loadUnits();
  }
}
async function loadUnits() {
  const army = $("#favArmy").value;
  $("#favUnits").innerHTML = "";
  if (!army) return;
  const sheets = await api(`/api/scribe/datasheets?faction=${encodeURIComponent(army)}`).catch(() => []);
  $("#favUnits").innerHTML = sheets.filter(s => s.own).map(s => `<option value="${s.name.replace(/"/g, "&quot;")}"></option>`).join("");
}
function applyFavFor() {
  const army = $("#favArmy").value, unit = $("#favUnit").value.trim();
  const favoriteKey = army && unit ? `${army}|${unit}` : "";
  $("#favHint").textContent = favoriteKey ? `Starring models for ${unit} (${army}).`
    : "Pick an army and a unit, then star the models you like for it. Scribe tries a unit's favourites first when it picks models, and lists them first when you choose.";
  browser.open({faction: army, sub: "", query: $("#browser .mb-q")?.value || "", favoriteKey, onPick});
}
$("#favArmy").addEventListener("change", async () => { $("#favUnit").value = ""; await loadUnits(); applyFavFor(); });
$("#favUnit").addEventListener("change", applyFavFor);
$("#favClear").addEventListener("click", () => { $("#favArmy").value = ""; $("#favUnit").value = ""; applyFavFor(); });
loadArmies();
</script>
</body>
</html>
